name: E2E (testcontainers)

# Runs the integration suite (real Kafka + Postgres via testcontainers).
# Not on every PR — Docker image pulls dominate wall time and tests don't
# touch the unit-test path. Triggered nightly + on-demand for verification.
#
# Security note: this workflow takes no untrusted inputs (no PR titles,
# issue bodies, commit messages, etc.) — only static commands.

on:
  schedule:
    # 02:00 UTC daily = 11:00 KST (after typical day-of-work commits)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship Docker, so no extra setup needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv312
          backend/.venv312/bin/pip install --upgrade pip
          backend/.venv312/bin/pip install -r backend/requirements.txt

      - name: Run integration tests
        run: npm run qa:e2e
