# 무중단 배포(Zero-downtime) 시연용 매니페스트 — 발표 자료.
#
# ⚠️ 평가 환경에서 실제 클러스터에 배포하지 않는다. Render(Web)가 동일한 개념
#    (헬스체크 기반 롤링 전환)을 매니지드로 제공하므로, 이 yaml은 "배운 K8s
#    개념을 어떻게 적용했는가"를 코드로 보이기 위한 illustrative manifest다.
#
# 핵심 3개념 (수업 커리큘럼 ↔ 우리 구현):
#   1) RollingUpdate (maxUnavailable=0)  → 무중단: 새 Pod가 Ready 되기 전 옛 Pod 종료 안 함
#   2) readinessProbe (/ready)           → DB 연결 OK일 때만 트래픽 수신 (서비스 엔드포인트 편입)
#   3) livenessProbe (/health)           → 프로세스 hang 시 재시작 (DB 미접근, 가벼움)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-manager-backend
  labels: { app: student-manager, component: backend }
spec:
  replicas: 2  # 최소 2 → 롤링 중에도 항상 1개 이상 Ready 유지
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # 무중단의 핵심: 가용 Pod 수가 절대 줄지 않음
      maxSurge: 1         # 새 버전 Pod를 1개 추가로 띄운 뒤 Ready 확인 → 옛 Pod 교체
  selector:
    matchLabels: { app: student-manager, component: backend }
  template:
    metadata:
      labels: { app: student-manager, component: backend }
    spec:
      containers:
        - name: backend
          image: student-manager-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: sm-secrets, key: database-url } }
            - name: PYTHONPATH
              value: /app
          # liveness: 프로세스가 살아있는가? (응답 없으면 컨테이너 재시작)
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # readiness: 트래픽을 받을 준비가 됐는가? (DB 연결 확인 — 안 되면 Service에서 제외)
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: student-manager-backend
  labels: { app: student-manager, component: backend }
spec:
  selector: { app: student-manager, component: backend }
  ports:
    - port: 80
      targetPort: 8000
  # readinessProbe를 통과한 Pod만 이 Service의 엔드포인트에 편입된다.
  # → 롤링 중 아직 준비 안 된 새 Pod로는 트래픽이 가지 않음 = 무중단.
