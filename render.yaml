databases:
  - name: student-manager-db
    databaseName: student_manager
    user: sm
    plan: free

services:
  - type: web
    name: student-manager-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: student-manager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: INVITE_TOKEN_EXPIRE_HOURS
        value: "72"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: AUTH_LINK_DELIVERY
        value: stub
      # production에서는 stub OAuth(인증 우회)를 코드 레벨에서 차단한다.
      - key: ENVIRONMENT
        value: production
      # Teacher Google OAuth (REQ-001). "auto" → real once GOOGLE_CLIENT_ID is set.
      # 자격증명 미설정 시 OAuth 로그인은 503 (password 로그인은 정상). 안전한 기본값.
      - key: OAUTH_PROVIDER
        value: auto
      # ⚠️ 데모 한정: 실 OAuth 없이 stub를 켜려면 의식적으로 true. 인증 우회 위험 인지 후 사용.
      - key: ALLOW_OAUTH_STUB
        value: "false"
      - key: ALLOWED_TEACHER_DOMAINS
        sync: false # CSV e.g. "snu.ac.kr,example.edu"
      - key: OAUTH_DEFAULT_SCHOOL_ID
        sync: false # UUID of school new OAuth teachers join (demo)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # <vercel-frontend-url>/auth/oauth/google/callback
      # AI 교사 챗봇 (REQ — POST /api/v1/chat). 키 미설정 시 auto 모드가 stub으로 폴백.
      - key: OPENAI_API_KEY
        sync: false # 시크릿. 대시보드에서 값 입력 (sk-proj-...)
      - key: RUN_SEED
        value: "1"
      - key: APP_BASE_URL
        sync: false # Set in dashboard: your Vercel frontend URL
      - key: ALLOWED_ORIGINS
        sync: false # Set in dashboard: ["https://your-vercel-url.vercel.app"]

  # ─── Outbox CDC workers (ADR-003) ─────────────────────────────────────────
  # Background workers that drive the analytics pipeline:
  #   outbox-publisher → SELECT FOR UPDATE SKIP LOCKED + pg_notify
  #   analytics-worker → LISTEN + claim-by-event_id (SKIP LOCKED) + UPSERT
  # No managed Kafka required — message bus is Postgres itself.
  - type: worker
    name: student-manager-outbox-publisher
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # Background Workers require paid tier (~$7/mo per worker)
    dockerCommand: python -m app.workers.outbox_publisher
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: student-manager-db
          property: connectionString
      - key: LISTEN_NOTIFY_IDLE_POLL_INTERVAL
        value: "0.5"

  - type: worker
    name: student-manager-analytics-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    numInstances: 3
    dockerCommand: python -m app.workers.analytics
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: student-manager-db
          property: connectionString
      - key: LISTEN_NOTIFY_CATCHUP_INTERVAL
        value: "60.0"
      - key: OUTBOX_MAX_RETRIES
        value: "3"
