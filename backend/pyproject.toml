[project]
name = "student-manager-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# integration tests spin up real Kafka + Postgres via testcontainers; opt-in only.
# Default `pytest` runs unit tests only — use `pytest -m integration` to run them.
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end tests that require Docker (Kafka + Postgres via testcontainers)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

