services:
  db:
    image: postgres:15-alpine
    container_name: sm-db
    environment:
      POSTGRES_USER: sm
      POSTGRES_PASSWORD: smpass
      POSTGRES_DB: student_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm -d student_manager"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: sm-backend
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://sm:smpass@db:5432/student_manager
      TEST_DATABASE_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      INVITE_TOKEN_EXPIRE_HOURS: 72
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: 60
      APP_BASE_URL: http://localhost:5173
      AUTH_LINK_DELIVERY: stub
      RUN_SEED: 1
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # 교사 Google OAuth (REQ-006). client_id 있으면 real, 없으면 stub 폴백(dev 한정).
      # 시크릿은 gitignore된 루트 .env에서 주입 — compose 파일에 평문 커밋 금지.
      OAUTH_PROVIDER: ${OAUTH_PROVIDER:-auto}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/oauth/google/callback}
      ALLOWED_TEACHER_DOMAINS: ${ALLOWED_TEACHER_DOMAINS:-inu.ac.kr}
      OAUTH_DEFAULT_SCHOOL_ID: ${OAUTH_DEFAULT_SCHOOL_ID:-197e69ae-2a9b-45a1-933b-2f1553156bd1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    command: ["/app/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/seed.py:/app/seed.py
      - ./backend/docker-entrypoint.sh:/app/docker-entrypoint.sh

  outbox-publisher:
    build:
      context: ./backend
    container_name: sm-outbox-publisher
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://sm:smpass@db:5432/student_manager
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.workers.outbox_publisher"]
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app

  analytics-worker:
    build:
      context: ./backend
    # container_name 의도적으로 미지정 — `docker compose up --scale analytics-worker=N`
    # 으로 다중 인스턴스를 띄워 SKIP LOCKED 기반 작업 분배를 시연한다 (ADR-003).
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://sm:smpass@db:5432/student_manager
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.workers.analytics"]
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app

  frontend:
    image: node:20-alpine
    container_name: sm-frontend
    working_dir: /app
    environment:
      # Vite dev server proxy to backend service in the compose network
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata: {}
